[pytest]
# Run from `backend/`, so `app` is the top-level package -- the same import root
# uvicorn uses (`uvicorn app.main:app`). Keeping the two identical means a module that
# imports cleanly under test imports cleanly in the server.
pythonpath = .

# Both suites, always. They cover different things and each has caught a regression the
# other missed:
#   app/ai/tests  -- unit tests for the deterministic AI modules, no HTTP, no database
#   tests         -- the artisan-to-coordinator API flow through TestClient
# Running only the first is how a change to a default silently broke the API flow.
testpaths = app/ai/tests tests

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
